name: drawer_lying
mode: rl                           # RL loop (docs/RL_DESIGN.md); the cabinet lies on its back (user, 2026-11-23)
instruction: put the drawer into the compartment of the lying cabinet nearest the robot, pull facing up
goal: >-
  A small wooden cabinet lies on its back on the table, its three compartments open to the top, in a row. Its drawer
  stands on the table near the cabinet on its back wall, its front (the wall with the small metal label frame and the
  short metal tab, the pull) facing up. Put the drawer into the compartment nearest the robot arm, back wall first
  (down), so the pull faces up and the drawer's top is flush with the cabinet's rim. Lower it straight in; do not
  drop it; release it cleanly.
success: >-
  The drawer is fully inside the cabinet compartment nearest the robot arm, the right way round: its front with the
  metal pull faces up and is flush with the cabinet's top rim (within about 1 cm). Upside down (plain wooden wall up,
  no pull visible) or in another compartment is a failure. The cabinet has not moved, and the gripper is clear.
reset: >-
  Take the drawer out of the cabinet (pinch or grasp the pull and lift it straight up) and stand it on its back wall on
  the table at the target you are given, near the cabinet: the pull facing up, vary the yaw within +/-30 deg. The reset
  must work from ANY state an episode can leave: drawer fully or partly in the compartment, tilted, jammed, in another
  compartment, upside down, lying on the table on any side, still held by the gripper, the arm stopped low next to the
  cabinet. Never move the cabinet.
reset_orientation: >-
  The drawer stands upright on the table on one of its small end walls, next to (not inside) the lying cabinet, with
  its metal pull (a small grey label frame with a short tab) on the top face, facing up. If the drawer lies flat, is
  inside the cabinet, or the pull is not on top, the answer is false.
objects: [drawer]

fixtures:                          # 2026-11-23 measured with the freshly calibrated side camera (cloud with the arm pulled back) and a wrist look-down (runs/drawers_setup/lying/measure_20261123_160851)
  cabinet:
    centre: [0.5286, 0.0207]           # outer outline centre (base frame, m)
    yaw_deg: 21.2                 # long axis, along the three compartments (+ points away from the robot base)
    size: [0.275, 0.139]           # outer length x width (m)
    rim_h: 0.095                   # rim height above the table (m); the inserted drawer's top measured 0.097
    wall: 0.012
    floor_h: 0.013                 # compartment floor above the table (m)
    compartment: [0.0757, 0.1150]   # inner opening along x across (m)
    target_centre: [0.4469, -0.011]   # the compartment nearest the robot base
  flush_tol: 0.012

keep_out:                          # model check: no gripper point inside (rlpj.robot.sim); the body below the rim - 1.5 cm, the walls and dividers up to 0.5 cm above the rim (4 mm margin); the compartment openings are free
  - {name: cabinet_body, center: [0.5286, 0.0207, 0.024], half: [0.1415, 0.0735, 0.0400], yaw_deg: 21.2}
  - {name: cabinet_wall, center: [0.5516, -0.0385, 0.074], half: [0.1415, 0.0100, 0.0100], yaw_deg: 21.2}
  - {name: cabinet_wall, center: [0.406, -0.0269, 0.074], half: [0.0100, 0.0735, 0.0100], yaw_deg: 21.2}
  - {name: cabinet_wall, center: [0.5056, 0.0799, 0.074], half: [0.1415, 0.0100, 0.0100], yaw_deg: 21.2}
  - {name: cabinet_wall, center: [0.6512, 0.0683, 0.074], half: [0.0100, 0.0735, 0.0100], yaw_deg: 21.2}
  - {name: cabinet_divider, center: [0.4877, 0.0048, 0.074], half: [0.0100, 0.0735, 0.0100], yaw_deg: 21.2}
  - {name: cabinet_divider, center: [0.5695, 0.0366, 0.074], half: [0.0100, 0.0735, 0.0100], yaw_deg: 21.2}

layout:                            # reset target for the drawer (standing, pull up) on the table, base frame m
  drawer: {x: [0.506, 0.546], y: [-0.236, -0.196]}

perception:                        # size priors (m)
  drawer: {height: [0.05, 0.14], extent: [0.06, 0.16]}
  cabinet: {height: [0.08, 0.12], extent: [0.12, 0.30]}
rl:

  eval_every: 30                   # training episodes between fixed evaluations (20 -> 30 at 00:05: time-limited, skip the eval of a known-broken policy)
  eval_episodes: 5                 # deterministic-policy episodes per evaluation (10 -> 5 at 00:05: time-limited)
  target_success_rate: 0.7         # over one evaluation
  max_episodes: 600                # training episodes, then stop and report
  reflect_every_episode: true      # RL agent reflects on each episode while the next reset runs (2026-11-20, time-limited)
  review_every: 5                  # the RL agent's tuning turn (40 -> 10 -> 5 at 00:05: time-limited, react fast)
  learner_timeout_s: 300           # programs/learner.py between episodes (CPU on the robot machine)
  episode_timeout_s: 300
  reset_repairs: 10                # reset-agent repairs per failing reset before the run stops (default 2; 5 -> 10 at 21:30: user "the robot can, keep trying")
  force_limit_n: 65                # contact-force stop (N). 50 (user 11-17) stopped every insertion/push at the drawer's
                                   # static friction (51-57 N, then it slides at 2-6 N); 65 N on 2026-11-20 (user: raise the force cap to 65 N)

reuse: []
