name: drawer_rl
mode: rl                           # RL loop instead of collection + imitation (docs/RL_DESIGN.md)
instruction: put the drawer back into the bottom slot of the cabinet
goal: >-
  A small wooden cabinet with three slots is taped to the far end of the table, front facing the robot. Its bottom
  slot is empty and its drawer lies on the table. The drawer's front is the wall carrying the metal pull (a small
  label frame with a short tab below it). Put the drawer back into the bottom slot back wall first, the pull facing
  out (toward the robot), pushed fully in so its front is flush with the cabinet front.
success: >-
  The drawer is fully inside the bottom slot the right way round: its front with the metal pull faces out and is
  flush with the cabinet front (within about 1 cm). A drawer inserted backwards (plain wooden wall facing out, no pull
  visible) is a failure. The cabinet has not moved, and the gripper is clear of both.
reset: >-
  Pull the drawer out of the bottom slot if it is inside (it has no stop and is light), then put it on the table at the
  target you are given, upright (open side up), its front (the wall with the metal pull) facing the robot, away from
  the cabinet, as it comes out of the slot; vary the yaw within +/-30 deg of that. If the drawer is in the slot
  backwards (no pull outside), get it out by its protruding walls instead. The reset must work from ANY state an RL
  episode can leave: drawer flush or partly out, the right way round or backwards, cocked or jammed in the slot; on the
  table anywhere reachable, any yaw, upright, on its side or upside down; still held by the gripper; the arm stopped
  low next to the cabinet. Start by working out the state, free the arm, then recover. The drawer pull is about 4 cm above the table when the drawer is in the slot: a gripper held horizontal there
  is at table height, so plan the grasp (from above, or a wall of the drawer) with the tips above the table. Never move
  the cabinet; leave the two upper slots empty.
reset_orientation: >-
  The drawer lies upright on the table, open side up, and its metal pull (a small grey metal label frame with a short
  tab below it, on the outside of one wall) is on the wall that faces the robot arm's base: in this side-camera image
  the robot base is at the lower left and the cabinet at the upper right, so the pull must be on the drawer wall that
  faces the lower left (away from the cabinet), within about 45 deg. If the pull is on any other wall, or not visible
  at all (it is then on a wall facing away from the camera), the answer is false.
objects: [drawer]

fixtures:                          # measured 2026-11-17 after the side-camera recalibration (docs/RL_DESIGN.md section 5)
  cabinet:
    front_normal: [0.9282, 0.3722] # unit xy normal of the front face, pointing into the cabinet (insertion direction)
    front_offset: 0.5226           # front plane: normal . xy = offset (m)
    slot_h: [0.030, 0.090]         # bottom-slot window above the table (m): the drawer front fills it when inserted
    slot_t: [-0.120, -0.045]       # window along the front (t = -n_y x + n_x y, m); the front spans -0.135..-0.026
    height: 0.27
  flush_tol: 0.012                 # |distance to the front plane| for a flush point (m)

keep_out:                          # model check: no gripper point inside (rlpj.robot.sim); base frame, m, yaw about z
  # the cabinet body from 1 cm behind its front plane, except the bottom-slot opening (1.5-9.5 cm above the table), which is open to 3 cm: the
  # modelled fingertips of a closed gripper sit ~1 cm deeper than the real ones (2026-11-17, reset attempt 16: holding
  # the tab in front of the drawer face, modelled 10 mm behind it). The drawer face and the force stop cover the rest.
  - {name: cabinet, center: [0.6726, 0.1835, 0.1340], half: [0.1400, 0.0750, 0.1550], yaw_deg: 21.85}
  - {name: cabinet_front, center: [0.5334, 0.1277, -0.0110], half: [0.0100, 0.0750, 0.0100], yaw_deg: 21.85}
  - {name: cabinet_front, center: [0.5334, 0.1277, 0.1840], half: [0.0100, 0.0750, 0.1050], yaw_deg: 21.85}
  - {name: cabinet_front, center: [0.5548, 0.0743, 0.0390], half: [0.0100, 0.0175, 0.0400], yaw_deg: 21.85}
  - {name: cabinet_front, center: [0.5129, 0.1788, 0.0390], half: [0.0100, 0.0200, 0.0400], yaw_deg: 21.85}

layout:                            # reset target for the drawer centre on the table (base frame, m)
  drawer: {x: [0.34, 0.44], y: [-0.20, -0.02]}    # in front of and beside the cabinet, clear of its front by > 10 cm
  radius: [0.36, 0.52]
  tolerance: 0.05

perception:                        # size priors (m); the drawer is a guess until the reset agent measures it
  drawer: {height: [0.04, 0.10], extent: [0.08, 0.30]}
  cabinet: {height: [0.22, 0.32], extent: [0.10, 0.45]}

rl:
  eval_every: 20                   # training episodes between fixed evaluations
  eval_episodes: 10                # deterministic-policy episodes per evaluation
  target_success_rate: 0.7         # over one evaluation
  max_episodes: 600                # training episodes, then stop and report
  review_every: 40                 # the RL agent's tuning turn: curve + recent episodes, may change reward/hyperparameters
  learner_timeout_s: 300           # programs/learner.py between episodes (CPU on the robot machine)
  episode_timeout_s: 300
  reset_repairs: 5                 # reset-agent repairs per failing reset before the run stops (default 2)
  force_limit_n: 50                # contact-force stop (N; user 23:10). 25 N stopped drawer pulls (22-28 N); with none,
                                   # a snag reached 99.6 N and moved the cabinet 6 cm (RL attempt 5)

reuse: []
