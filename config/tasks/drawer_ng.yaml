name: drawer_ng
mode: rl                           # RL loop (docs/RL_DESIGN.md); near-goal, reset-free variant of drawer_rl (user, 2026-11-22)
instruction: push the drawer fully into the bottom slot of the cabinet
goal: >-
  A small wooden cabinet with three slots is taped to the far end of the table, front facing the robot. Its drawer sits
  partly inside the bottom slot, the right way round: the drawer's front, the wall carrying the metal pull (a small
  label frame with a short tab below it), faces out toward the robot and sticks out of the cabinet front by a few
  centimetres. An episode starts either from a fresh reset (front ~3-5 cm out, roughly straight) or from wherever the
  previous, failed episode left the drawer (it may be cocked, jammed, or further out). Push the drawer fully in so its
  front is flush with the cabinet front, straighten or back it out first if it is cocked, and release it cleanly
  without dragging it back out.
success: >-
  The drawer is fully inside the bottom slot the right way round: its front with the metal pull faces out and is
  flush with the cabinet front (within about 1 cm). A drawer inserted backwards (plain wooden wall facing out, no pull
  visible) is a failure. The cabinet has not moved, and the gripper is clear of both.
reset: >-
  Leave the drawer partly inside the bottom slot, never out on the table: the right way round (the metal pull facing
  out toward the robot), roughly straight, with its front the distance given in targets.json ("drawer_out", metres) in
  front of the cabinet front (within about 2 cm), gripper clear, arm at home. Usually the drawer is flush after a
  success: pinch the pull tab and pull it straight out to that distance. The reset must work from ANY state an episode
  can leave: flush, recessed, partly out, cocked or jammed in the slot, still held by the gripper, the arm stopped low
  next to the cabinet; if the drawer has come out of the slot, put it back into this near-goal state (partly inside,
  pull out), never to a far table position. Start by working out the state, free the arm, then recover. The drawer
  pull is about 4 cm above the table when the drawer is in the slot. Never move the cabinet; leave the two upper slots
  empty.
reset_orientation: >-
  The drawer is partly inside the bottom slot of the cabinet, roughly straight, with its front (the wall carrying the
  small metal label frame and tab) facing out of the slot toward the robot, sticking out of the cabinet front by a few
  centimetres. It is not lying on the table, not tipped over and not inserted backwards.
objects: [drawer]

fixtures:                          # 2026-11-21 15:30 (user approved): slot and keep-out +22.5 mm along t (slot centre -0.036): the 05:20 t part (-9 mm, from noisy cabinet outlines) had the wrong sign; reset wrist views at 05:07 (attempt 204: pads at the opening's right edge with aim -0.055, opening centre ~19 mm image-left = +t; judge 'knob left') and RL attempt 114 (drawer 2-3 cm on the -t side of the opening when aimed at -0.0585) agree. 2026-11-21 05:20: cabinet pushed back by the night's jams/recoveries, measured by the guard's full outlines (dn +14 mm, dt -6..-9 mm, 05:06 and 05:12; image check: camera unmoved): front, slot and keep-out shifted dn +15 mm, dt -9 mm; measured 2026-11-17; shifted 2026-11-20 by (dn -9.3 mm, dt -46 mm) = base-frame (+8.5, -46.2) mm: the robot base moved relative to the table/cabinet (re-measured after the automated side-camera calibration); 2026-11-20 21:30: slot and keep-out shifted dt +36 mm from the reset's wrist images (knob 3.6 cm image-left = +t in attempt 140, further away after a -35 mm shift in attempt 141, judge 'left' in attempt 142 whose corrected approach the old keep-out refused); 21:45 another +43 mm from the reset's wrist measurement of the knob (attempt 143: tab +43.3 mm along t from the planned aim, knob left of the left finger in the image)
  cabinet:
    front_normal: [0.9282, 0.3722] # unit xy normal of the front face, pointing into the cabinet (insertion direction)
    front_offset: 0.5283           # front plane: normal . xy = offset (m)
    slot_h: [0.030, 0.090]         # bottom-slot window above the table (m): the drawer front fills it when inserted
    slot_t: [-0.0735, 0.0015]       # window along the front (t = -n_y x + n_x y, m); the front spans -0.135..-0.026
    height: 0.27
  flush_tol: 0.012                 # |distance to the front plane| for a flush point (m)

keep_out:                          # model check: no gripper point inside (rlpj.robot.sim); base frame, m, yaw about z
  # the cabinet body from 1 cm behind its front plane, except the bottom-slot opening (1.5-9.5 cm above the table), which is open to 4 cm for the reset program and 2 cm for the RL (execute) program (box slot_rl_limit, roles: [execute]): the RL push cannot recess the drawer more than ~1 cm, the reset can reach in to recover a recessed one (2.4 cm on 2026-11-18 needed a person): the
  # modelled fingertips of a closed gripper sit ~1 cm deeper than the real ones (2026-11-17, reset attempt 16: holding
  # the tab in front of the drawer face, modelled 10 mm behind it). The drawer face and the force stop cover the rest.
  - {name: cabinet, center: [0.6653, 0.2306, 0.1340], half: [0.1350, 0.0750, 0.1550], yaw_deg: 21.85}
  - {name: cabinet_front, center: [0.5261, 0.1748, -0.0110], half: [0.0150, 0.0750, 0.0100], yaw_deg: 21.85}
  - {name: cabinet_front, center: [0.5261, 0.1748, 0.1840], half: [0.0150, 0.0750, 0.1050], yaw_deg: 21.85}
  - {name: cabinet_front, center: [0.5475, 0.1214, 0.0390], half: [0.0150, 0.0175, 0.0400], yaw_deg: 21.85}
  - {name: cabinet_front, center: [0.5056, 0.2258, 0.0390], half: [0.0150, 0.0200, 0.0400], yaw_deg: 21.85}
  - {name: slot_rl_limit, center: [0.5316, 0.1743, 0.0390], half: [0.0100, 0.0375, 0.0400], yaw_deg: 21.85, roles: [execute]}

layout:                            # reset target for the drawer centre on the table (base frame, m)
  drawer: {x: [0.36, 0.37], y: [-0.03, -0.01]}    # 2026-11-20: whole drawer in the moved side camera's view at any yaw (+-30 deg), >= 17 cm in front of the cabinet face
  radius: [0.36, 0.52]
  tolerance: 0.05

perception:                        # size priors (m); the drawer is a guess until the reset agent measures it
  drawer: {height: [0.04, 0.10], extent: [0.08, 0.30]}
  cabinet: {height: [0.22, 0.32], extent: [0.10, 0.45]}

rl:
  near_goal:                       # user 2026-11-22: reset only to "drawer partly in the slot"; after a failed episode the next one starts where it ended (reset-free)
    enabled: true
    pull_out: [0.03, 0.05]         # after a success (or when needed) the reset pulls the drawer straight out until its front is this far in front of the cabinet front (m)
    start_out: [0.005, 0.09]       # a failed episode's end state is the next start only with the drawer front this far out of the slot (else a reset)
    max_fail_streak: 3             # this many failed episodes in a row without a reset -> a reset
    orientation: >-
      The drawer is partly inside the bottom slot of the cabinet, roughly straight, with its front (the wall carrying
      the small metal label frame and tab) facing out of the slot toward the robot, sticking out of the cabinet front by
      a few centimetres. It is not lying on the table, not tipped over and not inserted backwards.
  eval_every: 30                   # training episodes between fixed evaluations (20 -> 30 at 00:05: time-limited, skip the eval of a known-broken policy)
  eval_episodes: 5                 # deterministic-policy episodes per evaluation (10 -> 5 at 00:05: time-limited)
  target_success_rate: 0.7         # over one evaluation
  max_episodes: 600                # training episodes, then stop and report
  reflect_every_episode: true      # RL agent reflects on each episode while the next reset runs (2026-11-20, time-limited)
  review_every: 5                  # the RL agent's tuning turn (40 -> 10 -> 5 at 00:05: time-limited, react fast)
  learner_timeout_s: 300           # programs/learner.py between episodes (CPU on the robot machine)
  episode_timeout_s: 300
  reset_repairs: 10                # reset-agent repairs per failing reset before the run stops (default 2; 5 -> 10 at 21:30: user "the robot can, keep trying")
  force_limit_n: 65                # contact-force stop (N). 50 (user 11-17) stopped every insertion/push at the drawer's
                                   # static friction (51-57 N, then it slides at 2-6 N); 65 N on 2026-11-20 (user: raise the force cap to 65 N)

reuse: []
