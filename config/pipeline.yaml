# Pipeline settings. Task details: config/tasks/<task>.yaml
task: bee_in_bowl

robot:
  ip: 192.168.2.9                  # kinova_a
  robots_json: ~/Documents/aaron/agentic_robotics/far_trials/robots.json

hosts:
  agent: Worksation_5090           # 5090 (100.122.29.80): agents, VLM judge, training (no route to the arm)
  policy_host: Worksation_5090     # where `rlpj eval` serves pi0.5: local (this 4090) or an ssh host; 5090 since 2026-11-06 (the 4090 GPU is shared with other jobs: 18.7 of 24.5 GB in use, the server ran out of memory)
  policy_server: 100.122.29.80     # address the rollout connects to (127.0.0.1 when policy_host is local)
  policy_port: 8000

recording: {fps: 15, width: 640, height: 360}

collection:
  round_size: 100                  # successful episodes per round
  max_episodes: 300
  refine_after_failures: 2         # execute failures in a row before Agent 1 repairs its program
  manual_reset_after_failures: 2   # reset failures in a row before the operator resets by hand
  reflect_after_every_run: true    # agents 1/2 reflect on every run while the other program uses the robot
  review_every: 0                  # episodes between periodic reviews (0 = off; reflections cover it)
  attempt_timeout_s: 1200           # any robot run (reset, execute, correction, agent test) is stopped after 20 min (attempt 220 hung 2 h 45 min)
  discard_unsure: true             # unsure episodes are deleted and redone (not counted, not queued for review)

evaluation:
  episodes: 20
  target_success_rate: 0.9
  max_policy_seconds: 150
  dagger: true                     # after a failed rollout the execute program takes over from the policy's last pose (mode 'dagger')

agents: {model: claude-opus-5-5, effort: medium, max_attempts: 25}
vlm: {model: claude-opus-5-5, effort: low}

training:
  base_checkpoint: gs://openpi-assets/checkpoints/pi05_base
  max_runs: 6
