# Pipeline settings. Task details: config/tasks/<task>.yaml
task: bee_in_bowl

robot:
  ip: 192.168.2.9                  # kinova_a
  robots_json: ~/Documents/aaron/agentic_robotics/far_trials/robots.json
  keep_in: {y: [-0.45, 0.30]}      # every gripper point (fingertips, body) stays inside, base frame m; the curtain hangs at
                                   # y +0.31..+0.37 (2026-11-07: a policy rollout reached y 0.295 and grasped it, faulting the arm)

hosts:
  agent: WorkStation_5090           # 5090 (100.122.29.80): agents, VLM judge, training (no route to the arm)
  policy_host: local               # 4090 GPU free after training (set by after_training.sh)
  policy_server: 127.0.0.1         # 100.122.29.80 when policy_host is the 5090
  policy_port: 8000
  train_host: local                # convert + train on this 4090 (nice 10); the 5090 loses power under sustained GPU load (2026-11-07)

recording: {fps: 15, width: 640, height: 360}

collection:
  round_size: 100                  # successful episodes per round
  max_episodes: 300
  refine_after_failures: 2         # execute failures in a row before Agent 1 repairs its program
  manual_reset_after_failures: 2   # reset failures in a row before the operator resets by hand
  reflect_after_every_run: false   # off 2026-11-14 (Rai): 590 reflections cost $1,344 of the run's $1,644 and changed a
                                   # program once; repairs after failures (refine_after_failures) stay on
  review_every: 50                 # periodic review of the window's failures only (nothing asked if all succeeded)
  attempt_timeout_s: 1200           # any robot run (reset, execute, correction, agent test) is stopped after 20 min (attempt 220 hung 2 h 45 min)
  discard_unsure: true             # unsure episodes are deleted and redone (not counted, not queued for review)

evaluation:
  episodes: 20
  target_success_rate: 0.7        # operator, 2026-11-07 (was 0.9)
  max_policy_seconds: 240        # user 2026-11-09 13:15 (was 150): eased chunks + remote inference made rollouts ~30 % slower
  dagger: true                     # after a failed rollout the execute program takes over from the policy's last pose (mode 'dagger')

agents: {model: claude-opus-5-5, effort: high, max_attempts: 25}   # effort medium -> high 2026-11-19 00:56 (user: push the hardest possible)
vlm: {model: claude-opus-5-5, effort: low}

training:
  base_checkpoint: gs://openpi-assets/checkpoints/pi05_base
  full_finetune_only: true         # operator, 2026-11-07: no LoRA; a training command must name a full fine-tuning config
  min_train_steps: 30000           # operator, 2026-11-07: every training run at least 30k steps
  max_runs: 6
